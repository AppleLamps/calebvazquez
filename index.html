<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caleb Vazquez Manifesto | Slide Reader</title>
  
  <!-- SEO Meta Tags -->
  <meta name="description" content="Read and navigate the Caleb Vazquez Manifesto report with an interactive, high-fidelity slide viewer. Features single-slide mode, scroll mode, search, and text selection.">
  <meta name="author" content="Vercel PDF Reader">
  
  <!-- Google Fonts: Source Serif 4 (document title) & IBM Plex Sans (interface) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,650;8..60,700&display=swap" rel="stylesheet">
  
  <!-- FontAwesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  
  <!-- PDF.js Styles (for text selection layer) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.css">
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="styles.css">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2212%22 fill=%22%23241f18%22/><path d=%22M24 20h52v60H24z%22 fill=%22%23f1ead9%22/><path d=%22M33 34h34M33 46h34M33 58h24%22 stroke=%22%238a5d1f%22 stroke-width=%224%22/></svg>">
</head>
<body>

  <!-- Loading Screen -->
  <div id="loading-overlay" class="loading-overlay">
    <div class="loader-content">
      <div class="loader-spinner"></div>
      <h2 class="loader-title">Caleb Vazquez Manifesto</h2>
      <p class="loader-subtitle">Loading Presentation...</p>
      <div class="progress-container">
        <div id="loader-progress" class="progress-bar" style="width: 0%"></div>
      </div>
      <p id="loader-percentage" class="loader-percentage">0%</p>
    </div>
  </div>

  <!-- Main Grid Layout -->
  <div class="app-container">
    
    <!-- Sidebar: Thumbnails -->
    <aside id="sidebar" class="sidebar collapsed">
      <div class="sidebar-header">
        <h3><i class="fa-solid fa-images"></i> Slides</h3>
        <button id="close-sidebar-btn" class="icon-btn close-btn" title="Close Sidebar">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
      </div>
      <div id="thumbnail-container" class="thumbnail-container">
        <!-- Thumbnails injected dynamically -->
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-viewer">
      
      <!-- Top Navigation Header -->
      <header class="app-header">
        <div class="header-left">
          <button id="toggle-sidebar-btn" class="icon-btn hover-glow" title="Toggle Slide Panel">
            <i class="fa-solid fa-bars"></i>
          </button>
          <div class="document-title-wrapper">
            <span class="status-badge"><span class="pulse-dot"></span>Archive Reader</span>
            <h1 class="document-title" id="main-document-title">Caleb Vazquez Manifesto</h1>
          </div>
        </div>

        <div class="header-center">
          <a href="https://x.com/lamps_apple" target="_blank" class="host-badge-center" title="Source posted by @lamps_apple on X">
            <i class="fa-brands fa-x-twitter"></i> Source <span class="host-highlight">@lamps_apple</span>
          </a>
        </div>

        <div class="header-right">
          <!-- Search box -->
          <div class="search-wrapper">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="search-input" placeholder="Search document">
            <span id="search-results-count" class="search-results-count hidden">0/0</span>
            <div class="search-nav-buttons hidden" id="search-nav-container">
              <button id="search-prev-btn" class="search-nav-btn" title="Previous match"><i class="fa-solid fa-chevron-up"></i></button>
              <button id="search-next-btn" class="search-nav-btn" title="Next match"><i class="fa-solid fa-chevron-down"></i></button>
            </div>
          </div>

          <div class="vertical-divider"></div>

          <!-- Layout mode toggle -->
          <div class="layout-toggle-group">
            <button id="btn-mode-presentation" class="layout-btn active" title="Single Slide Mode">
              <i class="fa-solid fa-table-columns"></i><span>Slide</span>
            </button>
            <button id="btn-mode-scroll" class="layout-btn" title="Continuous Scroll Mode">
              <i class="fa-solid fa-scroll"></i><span>Scroll</span>
            </button>
          </div>

          <div class="vertical-divider"></div>

          <button id="toggle-highlights-sidebar-btn" class="icon-btn highlights-toggle-btn" title="Toggle Highlights Panel" aria-expanded="false">
            <i class="fa-solid fa-highlighter"></i>
            <span id="highlights-toggle-badge" class="highlights-toggle-badge hidden">0</span>
          </button>

          <div class="vertical-divider"></div>

          <!-- Light/Dark Mode Toggle -->
          <button id="theme-toggle-btn" class="icon-btn theme-toggle" title="Toggle Theme">
            <i class="fa-solid fa-sun icon-sun"></i>
            <i class="fa-solid fa-moon icon-moon"></i>
          </button>
        </div>
      </header>

      <!-- Viewport for PDF rendering -->
      <div id="viewer-viewport" class="viewer-viewport presentation-mode">
        
        <!-- Presentation Nav Buttons (Floating overlays) -->
        <button id="prev-slide-overlay" class="slide-nav-overlay prev" title="Previous Slide (Left Arrow)">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        
        <!-- Document Canvas Container -->
        <div id="pages-container" class="pages-container">
          <!-- Pages/canvases dynamically loaded here -->
        </div>

        <button id="next-slide-overlay" class="slide-nav-overlay next" title="Next Slide (Right Arrow)">
          <i class="fa-solid fa-chevron-right"></i>
        </button>
      </div>

      <!-- Bottom reader controls -->
      <div class="floating-controls-wrapper">
        <div class="floating-controls">
          
          <!-- Page Jump Controls -->
          <div class="control-section page-selector">
            <button id="first-page-btn" class="control-btn" title="First Slide"><i class="fa-solid fa-backward-step"></i></button>
            <button id="prev-page-btn" class="control-btn" title="Previous Slide"><i class="fa-solid fa-chevron-left"></i></button>
            <div class="page-number-input-wrapper">
              <input type="number" id="current-page-input" value="1" min="1" max="1">
              <span class="total-pages-label">/ <span id="total-pages-text">1</span></span>
            </div>
            <button id="next-page-btn" class="control-btn" title="Next Slide"><i class="fa-solid fa-chevron-right"></i></button>
            <button id="last-page-btn" class="control-btn" title="Last Slide"><i class="fa-solid fa-forward-step"></i></button>
          </div>

          <div class="control-divider"></div>

          <!-- Zoom Controls -->
          <div class="control-section zoom-controls">
            <button id="zoom-out-btn" class="control-btn" title="Zoom Out"><i class="fa-solid fa-minus"></i></button>
            <span id="zoom-value-label" class="zoom-label">100%</span>
            <button id="zoom-in-btn" class="control-btn" title="Zoom In"><i class="fa-solid fa-plus"></i></button>
            <button id="zoom-fit-btn" class="control-btn" title="Fit to Screen"><i class="fa-solid fa-expand"></i></button>
          </div>

          <div class="control-divider"></div>

          <!-- Actions -->
          <div class="control-section action-controls">
            <button id="presentation-mode-btn" class="control-btn" title="Fullscreen Presentation"><i class="fa-solid fa-play"></i></button>
          </div>
        </div>
      </div>
    </main>

    <!-- Right sidebar: saved highlights -->
    <aside id="highlights-sidebar" class="highlights-sidebar collapsed" aria-label="Saved highlights">
      <div class="highlights-sidebar-header">
        <h3><i class="fa-solid fa-highlighter"></i> Highlights</h3>
        <span id="highlights-sidebar-count" class="highlights-count-badge">0</span>
        <button id="close-highlights-sidebar-btn" class="icon-btn close-btn" type="button" title="Close Highlights Panel">
          <i class="fa-solid fa-chevron-right"></i>
        </button>
      </div>
      <div class="highlights-sidebar-toolbar">
        <button id="clear-highlights-btn" class="highlights-clear-btn" type="button" title="Remove all highlights" disabled>
          Clear all
        </button>
      </div>
      <div id="highlights-list" class="highlights-list">
        <p class="highlights-empty">Select text on a slide and click <strong>Highlight</strong> to save notes here.</p>
      </div>
    </aside>
  </div>

  <!-- Floating toolbar when text is selected -->
  <div id="highlight-toolbar" class="highlight-toolbar hidden" role="toolbar" aria-label="Highlight selected text">
    <button id="highlight-save-btn" type="button" class="highlight-toolbar-btn" title="Save highlight">
      <i class="fa-solid fa-highlighter"></i>
      <span>Highlight</span>
    </button>
  </div>

  <div id="highlight-toast" class="highlight-toast hidden" role="status" aria-live="polite"></div>

  <!-- PDF.js Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  
  <!-- Application (ES modules) -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
